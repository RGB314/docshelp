[project]
name = "docshelp"
version = "0.1.0"
description = "A zero-cost course on the LangChain ecosystem, built as one support app: LangChain, LangGraph, LangSmith, Deep Agents and deployment"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "agentevals>=0.0.9",
    "deepagents>=0.7.21",
    "fastembed>=0.8.1",
    "langchain>=1.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-quickjs>=0.2.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-cli[inmem]>=0.4.32",
    "langgraph-sdk>=0.4.5",
    "langsmith>=0.14.1",
    "mcp>=1.30.0",
    "pillow>=12.0.0",
    "pyjwt>=2.10.0",
    "python-dotenv>=1.2.3",
    "trustcall>=0.0.39",
]

# One extra per model provider: `uv sync --extra ollama` (or `--all-extras`).
[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.7.4"]
openai = ["langchain-openai>=1.0.0"]
google = ["langchain-google-genai>=3.0.0"]
groq = ["langchain-groq>=1.0.0"]
ollama = ["langchain-ollama>=1.0.0"]
web = [
    "ddgs>=9.16.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test stuck this long dumps every thread's stack to stderr, so a hang in CI shows where it is.
faulthandler_timeout = 300
markers = [
    "e2e: end-to-end tests that run lessons as processes and start a real LangGraph Server (`poe e2e`)",
]
filterwarnings = [
    # trustcall (lessons 4.7-4.9) still imports Send from its pre-1.0 location; harmless until LangGraph 2.0.
    "ignore:Importing Send from langgraph.constants is deprecated",
    # langsmith's evaluator-name detection mentions ast.Str for older Pythons; harmless.
    "ignore:ast.Str is deprecated:DeprecationWarning",
    # The interpreter middleware (lessons 7.7, 7.12) is marked beta; the lessons say so.
    "ignore:The class `CodeInterpreterMiddleware` is in beta",
]

# Cross-shell task runner: `uv run poe <task>` behaves the same in PowerShell, cmd, Git Bash, macOS and Linux.
# `uv run poe` with no task lists them all.
[tool.poe.env]
PYTHONUTF8 = "1"

[tool.poe.tasks]
init-env = { script = "docshelp.tasks:init_env_main", help = "Create .env from .env.example (never overwrites)" }
doctor = { script = "docshelp.tasks:doctor_cli", help = "Check which model providers are installed and configured" }
setup = { sequence = ["init-env", "doctor"], help = "First-time setup: create .env, then check providers" }
test = { cmd = "pytest -m \"not e2e\"", help = "Unit and integration tests: offline, no API keys, ~1 min" }
e2e = { cmd = "pytest -m e2e", help = "End-to-end tests: lessons as processes + real LangGraph Server (no keys; real-model runs need DOCSHELP_E2E_MODEL + Ollama)" }
lessons = { script = "docshelp.tasks:lessons_main", help = "List every lesson in curriculum order" }
lesson = { script = "docshelp.tasks:lesson_main", help = "Run one lesson: uv run poe lesson 1.6 (extra args are passed on)" }
evals = { cmd = "pytest evals -p no:cacheprovider", help = "DocsHelp evals against your real model (LangSmith-tracked if configured; see lesson 5.9)" }
server = { cmd = "langgraph dev", help = "LangGraph Server + Studio on http://127.0.0.1:2024 (Part 8)" }
server-auth = { cmd = "langgraph dev --config langgraph.auth.json --port 2025", help = "The same server with auth, on http://127.0.0.1:2025 (lesson 8.10)" }
