name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Native runs with uv on every OS. No API keys: real-model E2E tests skip here.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes full version tags only (no moving major tag)
        with:
          enable-cache: true

      - name: Install (locked, all providers)
        run: uv sync --frozen --all-extras

      - name: Unit and integration tests
        run: uv run poe test

      - name: End-to-end tests (lessons as processes, real LangGraph Server, no keys)
        run: uv run poe e2e

  # The Docker path end to end, including every lesson against a real local model (Ollama), still keyless.
  # The real-model run takes ~45 minutes in one job, so it's split by part into parallel shards of ~12-15 minutes,
  # balanced on measured times. The `full` shard also runs
  # the unit tests, the keyless e2e tests and the compose-stack check, which only need to run once.
  docker-e2e-shard:
    name: docker-e2e (parts ${{ matrix.parts }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - parts: "7"
          - parts: "9"
          - parts: "1,2,3,5,6"
          - parts: "4,8"
            full: true
    env:
      E2E_MODEL: qwen2.5:0.5b
    steps:
      - uses: actions/checkout@v5

      - name: Write a keyless .env that uses the local model
        run: |
          {
            echo "DOCSHELP_PROVIDER=ollama"
            echo "DOCSHELP_MODEL=$E2E_MODEL"
            echo "DOCSHELP_FAST_MODEL=$E2E_MODEL"
            echo "DOCSHELP_MAX_TOKENS=512"
            echo "LANGSMITH_TRACING=false"
          } > .env

      - name: Build the image
        run: docker compose build

      - name: Unit and integration tests in the container
        if: matrix.full
        run: docker compose run --rm -T app poe test

      - name: Start Ollama and pull a small model
        run: |
          docker compose --profile ollama up -d ollama
          for i in $(seq 1 30); do docker compose exec -T ollama ollama list && break; sleep 2; done
          docker compose exec -T ollama ollama pull "$E2E_MODEL"

      - name: End-to-end tests in the container, these parts' lessons against the real model
        run: |
          if [ "${{ matrix.full }}" = "true" ]; then tests=""; else tests="tests/e2e/test_real_model.py tests/e2e/test_real_model_auth.py"; fi
          docker compose run --rm -T -e DOCSHELP_E2E_MODEL="$E2E_MODEL" -e DOCSHELP_E2E_PARTS="${{ matrix.parts }}" app poe e2e $tests -v -rs

      - name: Compose stack - LangGraph Server services + Part 8 clients over the compose network
        if: matrix.full
        run: |
          docker compose up -d --wait server server-auth
          docker compose run --rm -T app poe lesson 8.3
          docker compose run --rm -T app poe lesson 8.10

      - name: Show container logs
        if: failure()
        run: docker compose --profile ollama logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile ollama down -v

  # One check for branch protection: it requires `docker-e2e`, which passes only if every shard passed.
  docker-e2e:
    name: docker-e2e
    needs: docker-e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.docker-e2e-shard.result }}" = "success"
