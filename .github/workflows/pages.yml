name: Site

# The project website (GitHub Pages), generated from the repo's Markdown and the lesson docstrings by
# src/docshelp/site.py. Pull requests only build it (with --strict, so broken links fail); main also publishes it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --frozen

      - name: Build the site
        run: uv run poe site

      - name: Upload it for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
